name: Deep checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x64
          - os: windows-2025
            platform: win-x64
          - os: macos-26
            platform: darwin-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.19.0
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm test
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Build a test-only standalone bundle
        env:
          DEEP_REVISION: ${{ github.sha }}
          DEEP_PLATFORM: ${{ matrix.platform }}
        shell: bash
        run: >-
          python tools/build_bundle.py --platform "$DEEP_PLATFORM" --output bundles
          --source-revision "$DEEP_REVISION" --client-revision test-only
          --release-base-url https://example.invalid/test-only --allow-dirty
      - name: Run packaged research and conversion without system Node
        run: python tools/smoke_bundle.py bundles
